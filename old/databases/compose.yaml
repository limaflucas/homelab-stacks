services:
  #############################################
  # POSTGRESQL PRIMARY
  #############################################
  pgsql-primary:
    image: postgres:17
    hostname: postgresql-{{.Node.Hostname}}
    volumes:
      - /opt/docker-data/databases/postgresql/data:/var/lib/postgresql/data
      - /mnt/docker-data/databases/postgresql/init:/docker-entrypoint-initdb.d
      - /mnt/docker-data/databases/postgresql/pg_hba_homelab.conf:/var/lib/postgresql/pg_hba_homelab.conf
    environment:
      - TZ=America/Halifax
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_superuser_password
      - POSTGRES_DB=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        apt update
        apt install -y postgresql-17-pgvector

        exec docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c hot_standby=on \
          -c max_wal_senders=10 \
          -c max_replication_slots=10 \
          -c wal_keep_size=256 \
          -c synchronous_commit=on \
          -c archive_mode=off \
          -c listen_addresses='*' \
          -c max_connections=200 \
          -c hba_file=/var/lib/postgresql/pg_hba_homelab.conf
    secrets:
      - postgresql_superuser_password
      - postgresql_replication_password
      - pgpool_admin_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
      replicas: 1
      placement:
        constraints:
          - node.labels.pg == 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s

  #############################################
  # POSTGRESQL STANDBYS
  #############################################
  pgsql-standby:
    image: postgres:17
    hostname: postgresql-{{.Node.Hostname}}
    volumes:
      - /opt/docker-data/databases/postgresql/data:/var/lib/postgresql/data
      - /mnt/docker-data/databases/postgresql/pg_hba_homelab.conf:/var/lib/postgresql/pg_hba_homelab.conf
    environment:
      - TZ=America/Halifax
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_superuser_password
      - PGPASSFILE=/run/secrets/.pgpass
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        apt update
        apt install -y postgresql-17-pgvector

        # Wait for primary to be ready
        until pg_isready -h postgresql-vm-docker-adam -p 5432 -U postgres; do
          echo "Waiting for primary postgresql-vm-docker-adam..."
          sleep 10
        done

        # Only run basebackup if data dir is empty
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Running pg_basebackup from primary..."
          PGPASSWORD=$$(cat /run/secrets/postgresql_replication_password) \
          pg_basebackup \
            -h postgresql-vm-docker-adam \
            -U replicator \
            -D /var/lib/postgresql/data \
            -P -Xs -R
        fi

        # Start postgres
        exec docker-entrypoint.sh postgres \
          -c hot_standby=on \
          -c listen_addresses='*' \
          -c max_connections=200 \
          -c hba_file=/var/lib/postgresql/pg_hba_homelab.conf
    secrets:
      - postgresql_superuser_password
      - postgresql_replication_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
      replicas: 2
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.labels.pg != 1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 120s

  #############################################
  # PGPOOL - Load balancer + failover
  #############################################
  pgpool:
    image: docker.io/bitnamilegacy/pgpool:4
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        export PGPOOL_AES_KEY=$$(cat /run/secrets/pgpool_aes_key)
        exec /opt/bitnami/scripts/pgpool/entrypoint.sh \
            /opt/bitnami/scripts/pgpool/run.sh
    volumes:
      - /mnt/docker-data/databases/pgpool/pool_passwd:/opt/bitnami/pgpool/conf/pool_passwd
    environment:
      - TZ=America/Halifax
      - PGPOOL_BACKEND_NODES=0:postgresql-vm-docker-adam:5432,1:postgresql-vm-docker-zeus:5432,2:postgresql-vm-docker-bragi:5432
      - PGPOOL_BACKEND_APPLICATION_NAMES=postgresql-vm-docker-adam,postgresql-vm-docker-zeus,postgresql-vm-docker-bragi
      - PGPOOL_ENABLE_LOAD_BALANCING=yes
      - PGPOOL_ENABLE_STATEMENT_LOAD_BALANCING=yes
      - PGPOOL_DISABLE_LOAD_BALANCE_ON_WRITE=transaction
      - PGPOOL_MAX_POOL=50
      # Streaming replication check
      - PGPOOL_SR_CHECK_USER=pgpool
      - PGPOOL_SR_CHECK_PASSWORD_FILE=/run/secrets/pgpool_admin_password
      - PGPOOL_SR_CHECK_PERIOD=10
      - PGPOOL_SR_CHECK_DATABASE=postgres
      # Health check
      - PGPOOL_HEALTH_CHECK_USER=pgpool
      - PGPOOL_HEALTH_CHECK_PASSWORD_FILE=/run/secrets/pgpool_admin_password
      - PGPOOL_HEALTH_CHECK_PERIOD=10
      - PGPOOL_HEALTH_CHECK_TIMEOUT=5
      - PGPOOL_HEALTH_CHECK_MAX_RETRIES=3
      - PGPOOL_HEALTH_CHECK_RETRY_DELAY=3
      # Failover
      - PGPOOL_AUTO_FAILBACK=yes
      # Admin
      - PGPOOL_ADMIN_USERNAME=admin
      - PGPOOL_ADMIN_PASSWORD_FILE=/run/secrets/pgpool_admin_password
      # Backend postgres superuser
      - PGPOOL_POSTGRES_USERNAME=postgres
      - PGPOOL_POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_superuser_password
      - PGPOOL_ENABLE_LDAP=no
      - PGPOOL_AUTHENTICATION_METHOD=scram-sha-256
    secrets:
      - pgpool_admin_password
      - postgresql_superuser_password
      - pgpool_aes_key
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi      
      resources:
        limits:
          cpus: '0.5'
          memory: 512M    
      restart_policy:
        condition: any
        delay: 10s
        window: 120s

  #############################################
  # MINIO
  #############################################
  minio:
    image: minio/minio:latest
    hostname: "minio-{{.Node.Hostname}}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - /mnt/docker-data/databases/minio/data:/data
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi      
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  #############################################
  # MONGODB
  #############################################
  mongodb:
    image: mongo:8
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    hostname: "mongodb-{{.Node.Hostname}}"
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        exec docker-entrypoint.sh mongod \
          --quiet \
          --replSet rs0 \
          --bind_ip_all \
          --wiredTigerCacheSizeGB 0.25 \
          --keyFile /srv/mongodb/keyfile
    secrets:
      - mongodb_password
      - mongodb_user
      - source: mongodb_keyfile
        target: /srv/mongodb/keyfile
        uid: "999"
        gid: "999"
        mode: 0o400
    environment:
      TZ: "America/Halifax"
      MONGO_INITDB_ROOT_USERNAME_FILE: "/run/secrets/mongodb_user"
      MONGO_INITDB_ROOT_PASSWORD_FILE: "/run/secrets/mongodb_password"
    volumes:
      - /opt/docker-data/databases/mongodb/data:/data/db
      - /opt/docker-data/databases/mongodb/config:/data/configdb
    ports:
      - target: 27017
        published: 27017
        mode: host
    healthcheck:
      test: >
        mongosh \
          --username "$$(cat /run/secrets/mongodb_user)" \
          --password "$$(cat /run/secrets/mongodb_password)" \
          --authenticationDatabase admin \
          --eval "db.adminCommand('ping').ok" \
          --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      default:
        aliases:
          - mongodb-{{.Node.Hostname}}

  #############################################
  # REDIS
  #############################################
  redis:
    image: redis:8-alpine
    hostname: "redis-{{.Node.Hostname}}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

secrets:
  postgresql_superuser_password:
    external: true
  postgresql_replication_password:
    external: true
  pgpool_admin_password:
    external: true
  pgpool_aes_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
  mongodb_password:
    external: true
  mongodb_user:
    external: true
  mongodb_keyfile:
    external: true
