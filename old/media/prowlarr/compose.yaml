services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Halifax
    volumes:
      - /mnt/docker-data/media/prowlarr/config:/config
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - infra_media_internal

networks:
  infra_media_internal:
    external: true
