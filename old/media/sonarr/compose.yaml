services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Halifax
      - FILE__SONARR__POSTGRES__PASSWORD=/run/secrets/sonarr_database_password
      - SONARR__POSTGRES__HOST=pgpool
      - SONARR__POSTGRES__USER=sonarr
      - SONARR__POSTGRES__MAINDB=sonarr
      - SONARR__POSTGRES__LOGDB=sonarr_logs
    volumes:
      - /mnt/docker-data/media/sonarr/config:/config
      - /mnt/pirateflix/media/tv:/tv
      - /mnt/pirateflix/media/animes:/animes
      - /mnt/pirateflix/downloads/complete:/config/Downloads/complete
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - infra_media_internal
      - databases_internal
    secrets:
      - sonarr_database_password

networks:
  infra_media_internal:
    external: true
  databases_internal:
    external: true

secrets:
  sonarr_database_password:
    external: true
