services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    ports:
      - 5055:5055
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /run/secrets/seerr_db_password ]; then
          export DB_PASS=$$(cat /run/secrets/seerr_db_password)
        fi
        exec npm start
    environment:
      - TZ=America/Halifax
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - DB_TYPE=postgres
      - DB_HOST=pgpool
      - DB_PORT=5432
      - DB_USER=seerr
      - DB_NAME=seerr
    volumes:
      - /mnt/docker-data/media/seerr/config:/app/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    secrets:
      - seerr_db_password
    networks:
      - infra_media-internal
      - databases_internal

networks:
  infra_media-internal:
    external: true
  databases_internal:
    external: true

secrets:
  seerr_db_password:
    external: true
