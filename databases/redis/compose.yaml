services:
  redis:
    image: redis:8-alpine
    hostname: "redis-{{.Node.Hostname}}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - internal

networks:
  internal:
    driver: overlay
    internal: true
