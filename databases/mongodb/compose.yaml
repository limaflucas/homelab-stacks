services:
  mongodb:
    image: mongo:8
    hostname: "mongodb-{{.Node.Hostname}}"
    entrypoint: [ "bash", "-c" ]
    command:
      - |
        exec docker-entrypoint.sh mongod \
          --quiet \
          --replSet rs0 \
          --bind_ip_all \
          --wiredTigerCacheSizeGB 0.25 \
          --keyFile /srv/mongodb/keyfile
    secrets:
      - mongodb_password
      - mongodb_user
      - source: mongodb_keyfile
        target: /srv/mongodb/keyfile
        uid: "999"
        guid: "999"
        mode: 0o400
    environment:
      TZ: "America/Halifax"
      MONGO_INITDB_ROOT_USERNAME_FILE: "/run/secrets/mongodb_user"
      MONGO_INITDB_ROOT_PASSWORD_FILE: "/run/secrets/mongodb_password"
    volumes:
      - /opt/docker-data/databases/mongodb/data:/data/db
      - /opt/docker-data/databases/mongodb/config:/data/configdb
    ports:
      - target: 27017
        published: 27017
        mode: host
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 3 # one replica per node
      placement:
        max_replicas_per_node: 1 # enforce one per node
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - databases_internal

networks:
  databases_internal:
    external: true

secrets:
  mongodb_password:
    external: true
  mongodb_user:
    external: true
  mongodb_keyfile:
    external: true
