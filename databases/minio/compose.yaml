services:
  minio:
    image: minio/minio:latest
    hostname: "minio-{{.Node.Hostname}}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - /opt/docker-data/databases/minio/data:/data
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != vm-docker-bragi      
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - internal

networks:
  internal:
    driver: overlay
    internal: true

secrets:
  minio_root_user:
    external: true
  minio_root_password:
    external: true
