services:
  vaultwarden:
    image: vaultwarden/server:latest
    environment:
      - TZ=America/Halifax
    secrets:
      - vaultwarden_db_password
      - vaultwarden_db_user
    entrypoint: >
      /bin/sh -c "export DATABASE_URL=postgresql://$$(cat /run/secrets/vaultwarden_db_user):$$(cat /run/secrets/vaultwarden_db_password)@192.168.5.30:5432/vaultwarden && /vaultwarden"
    volumes:
      - /mnt/docker-data/services/vaultwarden:/data
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=vaultwarden_private
        - traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.homelab`)
        - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    networks:
      - vaultwarden_private

networks:
  vaultwarden_private:
    external: true
    name: vaultwarden_private

secrets:
  vaultwarden_db_password:
    external: true
  vaultwarden_db_user:
    external: true
