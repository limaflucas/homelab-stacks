services:
  appflowy-redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:      
      - appflowy_private
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M

  gotrue:
    image: appflowyinc/gotrue:latest
    environment:
      - TZ=America/Halifax
      - GOTRUE_ADMIN_EMAIL=${GOTRUE_ADMIN_EMAIL}
      - GOTRUE_ADMIN_PASSWORD=${GOTRUE_ADMIN_PASSWORD}
      - GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
      - GOTRUE_JWT_EXP=${GOTRUE_JWT_EXP}
      - DATABASE_URL=${GOTRUE_DATABASE_URL}
      - GOTRUE_DISABLE_SIGNUP=${GOTRUE_DISABLE_SIGNUP}
      - GOTRUE_MAILER_AUTOCONFIRM=${GOTRUE_MAILER_AUTOCONFIRM}
      - GOTRUE_SITE_URL=appflowy-flutter://
      - GOTRUE_URI_ALLOW_LIST=**
      - GOTRUE_API_ALLOW_CORS=true
      - GOTRUE_API_ALLOWED_CORS_ORIGINS=https://web.appflowy.homelab,https://cloud.appflowy.homelab
      - GOTRUE_JWT_ADMIN_GROUP_NAME=supabase_admin
      - GOTRUE_DB_DRIVER=postgres
      - API_EXTERNAL_URL=https://cloud.appflowy.homelab
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_INVITE=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/gotrue/verify
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/gotrue/verify
      - PORT=9999      
    healthcheck:
      test: "curl --fail http://127.0.0.1:9999/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - appflowy_private
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 32M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=appflowy_private
        - traefik.http.routers.gotrue.rule=Host(`gotrue.appflowy.homelab`)
        - traefik.http.routers.appflowy-cloud-gotrue.rule=Host(`cloud.appflowy.homelab`) && PathPrefix(`/gotrue/`)
        - traefik.http.routers.appflowy-cloud-gotrue.middlewares=appflowy-gotrue-strip,appflowy-gotrue-cors,appflowy-gotrue-hide-cors
        - traefik.http.middlewares.appflowy-gotrue-hide-cors.headers.customresponseheaders.Access-Control-Allow-Origin=
        - traefik.http.middlewares.appflowy-gotrue-hide-cors.headers.customresponseheaders.Access-Control-Allow-Credentials=
        - traefik.http.middlewares.appflowy-gotrue-strip.stripprefix.prefixes=/gotrue
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.accesscontrolalloworiginlistregex=^https://(web|cloud|admin)\.appflowy\.homelab$$
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.accesscontrolallowheaders=Authorization,Content-Type,X-Client-Info,Apikey
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.accesscontrolallowcredentials=true
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.accesscontrolmaxage=86400
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.addvaryheader=true
        - traefik.http.middlewares.appflowy-gotrue-cors.headers.customrequestheaders.Host=gotrue.appflowy.homelab
        - traefik.http.services.gotrue.loadbalancer.server.port=9999

  appflowy-cloud:
    image: appflowyinc/appflowy_cloud:latest
    volumes:
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - TZ=America/Halifax
      - RUST_LOG=info
      - APPFLOWY_ENVIRONMENT=production
      - APPFLOWY_DATABASE_URL=${APPFLOWY_DATABASE_URL}
      - APPFLOWY_DATABASE_MAX_CONNECTIONS=5
      - APPFLOWY_GOTRUE_JWT_SECRET=${GOTRUE_JWT_SECRET}
      - APPFLOWY_GOTRUE_BASE_URL=http://gotrue:9999
      - APPFLOWY_REDIS_URI=redis://appflowy-redis:6379
      - APPFLOWY_S3_CREATE_BUCKET=true
      - APPFLOWY_S3_USE_MINIO=true
      - APPFLOWY_S3_MINIO_URL=http://minio:9000
      - APPFLOWY_S3_ACCESS_KEY=${APPFLOWY_S3_ACCESS_KEY}
      - APPFLOWY_S3_SECRET_KEY=${APPFLOWY_S3_SECRET_KEY}
      - APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=https://api.minio.homelab
      - APPFLOWY_S3_BUCKET=appflowy-cloud
      - APPFLOWY_S3_REGION=us-east-1
      - APPFLOWY_ACCESS_CONTROL=true
      - APPFLOWY_WEB_URL=https://web.appflowy.homelab
      - APPFLOWY_BASE_URL=https://cloud.appflowy.homelab
      - APPFLOWY_SEARCH_SERVICE_URL=https://search.appflowy.homelab
      - APPFLOWY_SEARCH_REQUEST_TIMEOUT_SECS=10
      - AI_ENABLED=false
      - SIGNUP_WHITELIST_ENABLED=true
      - GUEST_INVITES_REQUIRE_ADMIN_APPROVAL=true
      - APPFLOWY_WEBSOCKET_MAILBOX_SIZE=3000
    healthcheck:
      test: "curl --fail http://127.0.0.1:8000/api/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - minio
      - appflowy_private      
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=appflowy_private
        - traefik.http.routers.appflowy-cloud.rule=Host(`cloud.appflowy.homelab`)
        - traefik.http.services.appflowy-cloud.loadbalancer.server.port=8000

  appflowy-admin:
    image: appflowyinc/admin_frontend:latest
    volumes:
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
    environment:
      - TZ=America/Halifax
      - APPFLOWY_GOTRUE_BASE_URL=https://gotrue.appflowy.homelab
      - APPFLOWY_BASE_URL=https://cloud.appflowy.homelab
      - APPFLOWY_ALLOWED_ORIGINS=**
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
    networks:
      - appflowy_private
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=appflowy_private
        - traefik.http.routers.appflowy-admin.rule=Host(`admin.appflowy.homelab`)
        - traefik.http.services.appflowy-admin.loadbalancer.server.port=3000

  appflowy-web:
    image: appflowyinc/appflowy_web:latest
    environment:
      - TZ=America/Halifax
      - APPFLOWY_BASE_URL=https://cloud.appflowy.homelab
      - APPFLOWY_GOTRUE_BASE_URL=https://cloud.appflowy.homelab/gotrue
      - APPFLOWY_WS_BASE_URL=wss://cloud.appflowy.homelab/ws/v2
    networks:
      - appflowy_private
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=appflowy_private
        - traefik.http.routers.appflowy-web.rule=Host(`web.appflowy.homelab`)
        - traefik.http.services.appflowy-web.loadbalancer.server.port=3000

networks:
  appflowy_private:
    external: true
    name: appflowy_private
  minio:
    external: true
    name: minio_net
