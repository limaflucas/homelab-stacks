model_list:
  #############################################
  # LOCAL — OLLAMA (zeus.ollama.homelab)
  #############################################
  # `ollama_chat/` (not `ollama/`) is the chat-tuned route: it uses Ollama's
  # /api/chat endpoint, which handles multi-turn and tool calling correctly.
  - model_name: gemma4:12b
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://zeus.ollama.homelab:11434

  - model_name: gemma4-full
    litellm_params:
      model: ollama_chat/gemma4-full:latest
      api_base: http://zeus.ollama.homelab:11434

  - model_name: gemma4:e4b
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: http://zeus.ollama.homelab:11434

  - model_name: llama3.1:8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://zeus.ollama.homelab:11434

  - model_name: qwen2.5-coder:7b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b-instruct-q5_K_M
      api_base: http://zeus.ollama.homelab:11434

  #############################################
  # ANTHROPIC — agent coding models
  #############################################
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  #############################################
  # ZHIPU / Z.AI — GLM
  #############################################
  # Routed through LiteLLM's OpenAI-compatible provider rather than a native
  # `zhipu/` prefix: Z.ai exposes an OpenAI-shaped API, and this route does not
  # depend on the installed LiteLLM version knowing a specific GLM release.
  # NOTE: api_base must keep the /v4 suffix — LiteLLM appends /chat/completions.
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZHIPU_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
  allow_requests_on_db_unavailable: true

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  drop_params: true
  telemetry: false
