services:
  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    command: ["--config", "/app/config/config.yaml", "--port", "4000", "--num_workers", "1", "--run_gunicorn"]
    environment:
      - TZ=America/Halifax
      - LITELLM_LOG=INFO
      - STORE_MODEL_IN_DB=True
      - DATABASE_URL=postgres://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD}@192.168.5.30:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - /mnt/docker-data/services/litellm/config.yaml:/app/config/config.yaml
    networks:
      - llms_private
    dns:
      - 192.168.5.19
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: any
        delay: 10s

      labels:
        - traefik.enable=true
        - traefik.swarm.network=llms_private
        - traefik.http.routers.litellm.rule=Host(`gtw.llm.homelab`)
        - traefik.http.services.litellm.loadbalancer.server.port=4000
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - DATABASE_URL=postgresql://${WEBUI_DB_USER}:${WEBUI_DB_PASSWORD}@192.168.5.30:5432/openwebui
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_BASE_URL=http://zeus.ollama.homelab:11434
      - ENABLE_SIGNUP=True
    volumes:
      - /mnt/docker-data/services/open-webui/uploads:/app/backend/uploads
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.swarm.network=llms_private
        - traefik.http.routers.open-webui.rule=Host(`chat.llm.homelab`)
        - traefik.http.services.open-webui.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llms_private

networks:
  llms_private:
    external: true
    name: llms_private
