services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    hostname: "minio-{{.Node.Hostname}}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - /mnt/docker-data/services/minio/data:/data
    networks:
      - public
      - minio
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

      labels:
        - traefik.enable=true
        - traefik.swarm.network=infra_public
        - traefik.http.routers.minio-api.rule=Host(`api.minio.homelab`)
        - traefik.http.routers.minio-api.service=minio-api
        - traefik.http.services.minio-api.loadbalancer.server.port=9000
        - traefik.http.routers.minio-console.rule=Host(`console.minio.homelab`)
        - traefik.http.routers.minio-console.service=minio-console
        - traefik.http.services.minio-console.loadbalancer.server.port=9001
  komodo:
    image: ghcr.io/moghtech/komodo-core:2
    environment:
      TZ: America/Halifax
      KOMODO_DATABASE_URI_FILE: /run/secrets/komodo_db_uri
      KOMODO_HOST: https://komodo.homelab
      KOMODO_TITLE: Homelab Komodo
      KOMODO_LOCAL_AUTH: "false"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_DISABLE_CONFIRM_DIALOG: "false"
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/peripheries.pub
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/komodo_webhook_secret
      KOMODO_JWT_SECRET_FILE: /run/secrets/komodo_jwt_secret
      KOMODO_FIRST_SERVER_NAME: "{{.Node.Hostname}}"
      KOMODO_OIDC_ENABLED: "true"
      KOMODO_OIDC_PROVIDER: https://auth.authelia.homelab
      KOMODO_OIDC_REDIRECT_HOST: https://auth.authelia.homelab
      KOMODO_OIDC_CLIENT_ID: komodo
      KOMODO_OIDC_CLIENT_SECRET_FILE: /run/secrets/komodo_oidc_client_secret
    secrets:
      - komodo_db_uri
      - komodo_webhook_secret
      - komodo_jwt_secret
      - komodo_oidc_client_secret
    volumes:
      - /mnt/docker-data/services/komodo/keys:/config/keys
      - /mnt/docker-data/services/komodo/backups:/backups
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/usr/local/share/ca-certificates/homelab-root-ca.crt:ro
      - /mnt/docker-data/services/komodo/repos:/repo-cache
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9120/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 96M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=infra_public
        - traefik.http.routers.komodo.rule=Host(`komodo.homelab`)
        - traefik.http.services.komodo.loadbalancer.server.port=9120
    networks:
      - public
    dns:
      - 192.168.5.19

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    init: true
    environment:
      TZ: America/Halifax
      PERIPHERY_CORE_ADDRESS: "ws://komodo:9120"
      PERIPHERY_CONNECT_AS: "{{.Node.Hostname}}"
      PERIPHERY_CORE_PUBLIC_KEYS: "file:/config/keys/core.pub"
      PERIPHERY_ONBOARDING_KEY_FILE: /run/secrets/onboarding_{{.Node.Hostname}} 
    volumes:
      - /mnt/docker-data/services/periphery/{{.Node.Hostname}}/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc:ro
      - /mnt/docker-data/services/komodo/keys/core.pub:/config/keys/core.pub:ro
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/usr/local/share/ca-certificates/homelab-root-ca.crt:ro
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - public
    secrets:
      - onboarding_vm-docker-adam
      - onboarding_vm-docker-zeus
      - onboarding_vm-docker-bragi

  traefik:
    image: traefik:v3.7
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --api.dashboard=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=infra_public
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.aliasHeadersStrategy=delete
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.priority=1
      - --entryPoints.websecure.address=:443
      - --entryPoints.websecure.http.aliasHeadersStrategy=delete
      - --entryPoints.websecure.asDefault=true
      - --entryPoints.websecure.http.tls.certResolver=stepca
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0
      - --entryPoints.proxmox.address=:8006
      - --entryPoints.proxmox.transport.respondingTimeouts.readTimeout=0
      - --certificatesResolvers.stepca.acme.caServer=https://stepca.homelab/acme/acme/directory
      - --certificatesResolvers.stepca.acme.caCertificates=/certs/homelab-root-ca.crt
      - --certificatesResolvers.stepca.acme.email=traefik@homelab
      - --certificatesResolvers.stepca.acme.storage=/data/acme.json
      - --certificatesResolvers.stepca.acme.keyType=EC256
      - --certificatesResolvers.stepca.acme.certificatesDuration=24
      - --certificatesResolvers.stepca.acme.httpChallenge.entryPoint=web
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
      - target: 8006
        published: 8006
        protocol: tcp
        mode: ingress
    environment:
      TZ: 'America/Halifax'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/docker-data/services/traefik/data:/data
      - /mnt/docker-data/services/traefik/dynamic:/etc/traefik/dynamic:ro
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/certs/homelab-root-ca.crt:ro
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`traefik.authelia.homelab`)
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=authelia@swarm
        - traefik.http.routers.dashboard.tls.certresolver=stepca
        - traefik.http.services.traefik.loadbalancer.server.port=8080
    networks:
      public:
      mouseion_private:
      vaultwarden_private:
      appflowy_private:
      llms_private:
      devflow_private:

  registry:
    image: registry:2
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    environment:
      TZ: America/Halifax
      REGISTRY_LOG_LEVEL: warn
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_SECRET_FILE: /run/secrets/registry_http_secret
      REGISTRY_HTTP_RELATIVEURLS: 'true'
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: 'Homelab Registry Realm'
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
    volumes:
      - /mnt/docker-data/services/registry:/var/lib/registry
    secrets:
      - registry_http_secret
      - registry_htpasswd
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/v2/ 2>&1 | grep -qE '200 OK|401 Unauthorized'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=infra_public
        - traefik.http.routers.registry.rule=Host(`registry.homelab`)
        - traefik.http.services.registry.loadbalancer.server.port=5000
    networks:
      - public

  authelia:
    image: authelia/authelia:latest
    environment:
      - TZ=America/Halifax
      - X_AUTHELIA_CONFIG_FILTERS=template
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia_jwt_secret
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia_session_secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia_storage_encryption_key
      - AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE=/run/secrets/authelia_db_password
      - AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE=/run/secrets/authelia_oidc_hmac_secret
    volumes:
      - /mnt/docker-data/services/authelia/config:/config
    secrets:
      - authelia_jwt_secret
      - authelia_session_secret
      - authelia_storage_encryption_key
      - authelia_db_password
      - authelia_oidc_hmac_secret
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=infra_public
        - traefik.http.routers.authelia.rule=Host(`auth.authelia.homelab`) || Host(`authelia.homelab`) || Host(`redirect.authelia.homelab`)
        - traefik.http.services.authelia.loadbalancer.server.port=9091
        - traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth
        - traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true
        - traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name
        - traefik.http.middlewares.authelia.forwardauth.maxResponseBodySize=1048576
    networks:
      - public

networks:
  public:
    driver: overlay
  minio:
    driver: overlay
    name: minio_net
    attachable: true
  mouseion_private:
    driver: overlay
    name: mouseion_private
    attachable: true
  vaultwarden_private:
    driver: overlay
    name: vaultwarden_private
    attachable: true
  appflowy_private:
    driver: overlay
    name: appflowy_private
    attachable: true
  llms_private:
    driver: overlay
    name: llms_private
    attachable: true
  devflow_private:
    driver: overlay
    name: devflow_private
    attachable: true

secrets:
  komodo_db_uri:
    external: true
    name: komodo_db_uri_v2
  komodo_webhook_secret:
    external: true
  komodo_jwt_secret:
    external: true
  komodo_oidc_client_secret:
    external: true
  onboarding_vm-docker-adam:
    external: true
  onboarding_vm-docker-zeus:
    external: true
  onboarding_vm-docker-bragi:
    external: true
  registry_http_secret:
    external: true
  registry_htpasswd:
    external: true
  authelia_jwt_secret:
    external: true
  authelia_session_secret:
    external: true
  authelia_storage_encryption_key:
    external: true
  authelia_db_password:
    external: true
  authelia_oidc_hmac_secret:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true
