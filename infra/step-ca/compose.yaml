services:
  step-ca:
    image: smallstep/step-ca:latest
    ports:
      - "9000:9000"
    environment:
      - TZ=America/Halifax
      - DOCKER_STEPCA_INIT_NAME=Homelab CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,stepca.homelab,localhost
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=step-ca
      - DOCKER_STEPCA_INIT_ACME=true
      - DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT=true
      - DOCKER_STEPCA_INIT_PASSWORD_FILE=/run/secrets/root_ca_key_password

    # FIX 1: Consolidate storage into a single directory mapping so secrets survive restarts
    volumes:
      - /mnt/docker-data/infra/step-ca/config:/home/step/config
      - /mnt/docker-data/infra/step-ca/certs:/home/step/certs
      - /mnt/docker-data/infra/step-ca/db:/home/step/db
    # FIX 2: Explicitly pass ownership of the secrets to the non-root step user (UID 1000)
    secrets:
      - source: step_ca_password
        target: root_ca_key_password
        uid: "1000"
        gid: "1000"
      - source: step_ca_root_ca_key
        target: root_ca_key
        uid: "1000"
        gid: "1000"
      - source: step_ca_root_ca_crt
        target: root_ca.crt
        uid: "1000"
        gid: "1000"
    networks:
      - infra
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: [ "CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

networks:
  infra:
    external: true

secrets:
  step_ca_password:
    external: true
  step_ca_root_ca_key:
    external: true
  step_ca_root_ca_crt:
    external: true