version: '3.8'

services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    init: true
    environment:
      PERIPHERY_CORE_ADDRESS: "https://komodo.homelab"
      PERIPHERY_CONNECT_AS: "${PVE_NODE}"
      PERIPHERY_ONBOARDING_KEY: "${ONBOARDING_KEY}"
      PERIPHERY_CORE_PUBLIC_KEYS: "file:/config/keys/core.pub"
      PERIPHERY_ROOT_DIRECTORY: "/etc/komodo"
      PERIPHERY_INCLUDE_DISK_MOUNTS: "/etc/hostname"
    volumes:
      # In a global deployment, these bind mounts map to the LOCAL host directories
      # of whichever node the agent is currently running on.
      - /mnt/docker-data/infra/periphery/${PVE_NODE}/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /mnt/docker-data/apps/komodo/etc/komodo:/etc/komodo
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
