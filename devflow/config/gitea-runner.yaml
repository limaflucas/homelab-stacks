log:
  level: info

runner:
  file: .runner
  capacity: 5
  timeout: 1h
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "homelab:docker://docker.gitea.com/runner-images:ubuntu-24.04"

cache:
  enabled: false

container:
  network: devflow_private
  privileged: false
  valid_volumes: []
  docker_host: "-"
  force_pull: false
