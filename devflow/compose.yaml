services:
  gitea:
    image: gitea/gitea:1
    ports:
      - "2222:22"
    environment:
      - TZ=America/Halifax
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=192.168.5.30:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD__FILE=/run/secrets/gitea_db_password
      - GITEA__server__DOMAIN=gitea.homelab
      - GITEA__server__ROOT_URL=https://gitea.homelab/
      - GITEA__server__SSH_DOMAIN=gitea.homelab
      - GITEA__server__SSH_PORT=2222
      - GITEA__security__ALLOWED_HOST_LIST=komodo.homelab
    volumes:
      - /mnt/docker-data/services/gitea/data:/data
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
    secrets:
      - gitea_db_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 160M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=devflow_private
        - traefik.http.routers.gitea.rule=Host(`gitea.homelab`)
        - traefik.http.services.gitea.loadbalancer.server.port=3000
    networks:
      - devflow_private

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    environment:
      - TZ=America/Halifax
    volumes:
      - /mnt/docker-data/services/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    networks:
      - devflow_private

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        cat > /etc/rabbitmq/conf.d/20-plane.conf <<EOF
        default_user = plane
        default_pass = $$(cat /run/secrets/rabbitmq_password)
        default_vhost = plane
        EOF
        chown rabbitmq:rabbitmq /etc/rabbitmq/conf.d/20-plane.conf
        chmod 400 /etc/rabbitmq/conf.d/20-plane.conf
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      - TZ=America/Halifax
    volumes:
      - /mnt/docker-data/services/rabbitmq:/var/lib/rabbitmq
    secrets:
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 224M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    networks:
      - devflow_private

  plane:
    image: makeplane/plane-aio-community:stable
    command:
      - /bin/bash
      - -c
      - |
        set -e
        mkdir -p /app/logs/access /app/logs/error /app/data
        export DATABASE_URL="$$(cat /run/secrets/plane_db_url)"
        export SECRET_KEY="$$(cat /run/secrets/plane_secret_key)"
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/plane_minio_access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/plane_minio_secret_key)"
        export AMQP_URL="amqp://plane:$$(cat /run/secrets/rabbitmq_password)@rabbitmq:5672/plane"
        exec /app/start.sh
    environment:
      - TZ=America/Halifax
      - DOMAIN_NAME=plane.homelab
      - APP_PROTOCOL=https
      - SITE_ADDRESS=:80
      - REDIS_URL=redis://valkey:6379/0
      - AWS_REGION=us-east-1
      - AWS_S3_BUCKET_NAME=plane-app
      - AWS_S3_ENDPOINT_URL=https://api.minio.homelab
      - AWS_CA_BUNDLE=/etc/ssl/certs/homelab-ca.crt
      - FILE_SIZE_LIMIT=5242880
    volumes:
      - /mnt/docker-data/services/plane/data:/app/data
      - /mnt/docker-data/services/plane/logs:/app/logs
      - /mnt/docker-data/services/homelab-ca/root_ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
    secrets:
      - plane_db_url
      - plane_secret_key
      - plane_minio_access_key
      - plane_minio_secret_key
      - rabbitmq_password
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 300s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=devflow_private
        - traefik.http.routers.plane.rule=Host(`plane.homelab`)
        - traefik.http.services.plane.loadbalancer.server.port=80
    networks:
      - devflow_private
      - minio

  unleash:
    image: unleashorg/unleash-server:8.2.1
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a
        . /run/secrets/unleash.env
        set +a
        exec docker-entrypoint.sh node dist/server.js
    environment:
      - TZ=America/Halifax
      - UNLEASH_URL=https://unleash.homelab
      - DATABASE_SSL=false
      - SEND_TELEMETRY=false
      - LOG_LEVEL=warn
    secrets:
      - source: unleash_env
        target: unleash.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4242/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.swarm.network=devflow_private
        - traefik.http.routers.unleash.rule=Host(`unleash.homelab`)
        - traefik.http.services.unleash.loadbalancer.server.port=4242
    networks:
      - devflow_private
      - unleash

networks:
  devflow_private:
    external: true
    name: devflow_private
  minio:
    external: true
    name: minio_net
  unleash:
    driver: overlay
    name: unleash
    attachable: true

secrets:
  gitea_db_password:
    external: true
  plane_db_url:
    external: true
    name: plane_db_url_v2
  plane_secret_key:
    external: true
  plane_minio_access_key:
    external: true
  plane_minio_secret_key:
    external: true
  rabbitmq_password:
    external: true
  unleash_env:
    external: true
    name: unleash_env_v1
